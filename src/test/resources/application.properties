# ===============================================
# =    Spring Boot Test Configuration           =
# ===============================================

# --- Stripe Configuration ---
# Provide mock or test keys for your tests.
stripe.secret_key=${stripe.secret_key}
stripe.webhook-secret=${stripe.webhook_secret}

# --- Database Configuration ---
# Use the H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate Configuration for H2 ---
# Let Hibernate create and drop the schema for each test run
spring.jpa.hibernate.ddl-auto=create-drop
# Use the H2 dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# --- Disable manual SQL script initialization for tests ---
# ddl-auto=create-drop is sufficient
spring.sql.init.mode=never

# --- Other Application Properties ---
# Provide values for CORS so the MainConfig bean can be created
# NOTE: Cannot use "*" for origins when allowCredentials is true.
cors.urls=http://localhost:8080
cors.mappings=/**